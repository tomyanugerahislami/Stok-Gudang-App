name: stok_gudang_app
description: "Aplikasi manajemen stok gudang sederhana menggunakan Flutter dan Supabase."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.18.3
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  mobile_scanner: ^7.5.0
  barcode: ^2.2.9
  barcode_widget: ^2.0.4
  pdf: ^3.12.0
  printing: ^5.14.3
  excel: ^4.0.6
  flutter_dotenv: ^6.0.1
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
