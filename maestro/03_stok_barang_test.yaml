appId: com.example.stok_gudang_app
---
# GUI test: membuka menu stok dan mencoba alur tambah barang
- launchApp
- tapOn:
    text: ".*Stok.*"
- assertVisible:
    text: ".*Stok Barang.*"
- tapOn:
    text: ".*Tambah Barang.*"
- assertVisible:
    text: ".*Nama Barang.*"
- tapOn:
    text: "Nama Barang"
- inputText: "Oli Mesin 10W-40"
- tapOn:
    text: "Kode Barang"
- inputText: "OLI1040"
- tapOn:
    text: "Simpan"
- assertVisible:
    text: "Oli Mesin 10W-40"
